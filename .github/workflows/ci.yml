name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    uses: tesserix/tesserix-workflows/.github/workflows/go-ci.yml@62f7f663a98d5ef92567850dd03c8c2513c9068e
    with:
      go_version: 1.26.x
      coverage_min_lines: 70

  secret-scan:
    uses: tesserix/tesserix-workflows/.github/workflows/secret-scan.yml@62f7f663a98d5ef92567850dd03c8c2513c9068e

  architecture:
    name: Architecture boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check architecture
        run: go run ./architecture/check_layers.go
