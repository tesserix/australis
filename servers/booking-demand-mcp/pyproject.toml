[project]
name = "booking-demand-mcp"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
  "tesserix-mcp-runtime @ https://github.com/tesserix/tesserix-mcp-runtime/releases/download/v0.1.0-rc.6/tesserix_mcp_runtime-0.1.0rc6-py3-none-any.whl",
  "jsonschema>=4.26,<5",
]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[dependency-groups]
dev = ["tesserix-mcp-manifest @ https://github.com/tesserix/tesserix-mcp-runtime/releases/download/v0.1.0-rc.6/tesserix_mcp_manifest-0.1.0rc6-py3-none-any.whl", "pytest>=9,<10", "pytest-asyncio>=1,<2", "ruff>=0.14,<1", "mypy>=1.18,<3", "types-jsonschema>=4,<5"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
[tool.hatch.metadata]
allow-direct-references = true
